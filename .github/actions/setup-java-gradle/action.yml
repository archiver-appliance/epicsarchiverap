name: Setup Java and Gradle
description: Set up JDK 25 (Temurin) and Gradle, shared across CI workflows.

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: "25"
        distribution: "temurin"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
